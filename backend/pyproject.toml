[project]
name = "career-advisor-backend"
version = "0.1.0"
description = "Agentic AI Career Advisor: LangGraph agents behind a FastAPI API"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Agents and orchestration
    "langchain>=1.0.2,<2",
    "langchain-core>=1.0.4,<2",
    "langchain-classic>=1.0,<2",
    "langchain-community>=0.4,<1",
    "langchain-text-splitters>=1.0,<2",
    "langchain-groq>=1.0,<2",
    "langchain-cohere>=0.5",
    "langchain-tavily>=0.2.13",
    "langgraph>=1.0.1,<2",
    "langgraph-checkpoint-postgres>=3.0,<4",
    # Vector store and embeddings
    "chromadb>=1.1,<2",
    "langchain-chroma>=1.0,<2",
    "langchain-huggingface>=1.0.1,<2",
    "sentence-transformers>=5.1,<6",
    "torch>=2.4",
    "huggingface-hub",
    # API
    "fastapi>=0.119",
    "uvicorn[standard]>=0.37",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.1",
    # Database
    "sqlalchemy>=2.0.44,<3",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    # Scraping
    "beautifulsoup4>=4.14",
    "requests>=2.32",
    # Documents
    "pypdf>=6.2",
    "pdfplumber>=0.11.7",
    "python-docx>=1.2",
    # NLP
    "spacy>=3.8.7,<3.9",
    "en-core-web-sm",
    "tiktoken>=0.12",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
